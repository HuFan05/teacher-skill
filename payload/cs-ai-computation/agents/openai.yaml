interface:
  display_name: "CS/AI Computation & Experiments"
  short_description: "Route computations efficiently and verify proportionately"
  default_prompt: >-
    Use $cs-ai-computation only for computer-science and AI computation and experiment tasks; do not route unrelated work to it or perform work outside that scope. Define the computation and do a bounded problem-structure precheck before committing to a backend-dependent implementation. For nontrivial work that still requires computation, read or create the persistent local backend inventory first through the cross-platform Python entry; when Python is unavailable but PowerShell 7 is callable, use the PowerShell compatibility entry. Never require or install PowerShell merely to run inventory. Reject a snapshot recorded for another operating system or architecture. A valid cache hit must not start Python, a framework, an accelerator query, a solver, a proof assistant, a profiler, or any MCP tool; merge the cached local facts with the current session's advertised tools, choose a primary route and concrete fallback, and live-check only the selected backend. Treat persisted MCP information as historical only, because current MCP callability requires current-session discovery and an actual selected call. Refresh or invalidate only the affected local record when a recorded path disappears, a version materially changes, or execution fails.

    Always estimate feasibility first, especially for training runs, large evaluation or ablation grids, and exhaustive enumerations. Interpret 'enough to answer' from the requested deliverable: when the user explicitly asks for a concrete result and an allowed callable backend can reasonably finish, actual execution and delivery of the computed result are mandatory; do not return only code, an untested script, or an estimated or recalled number for a feasible request. Warn about long runtime but continue; only the user may choose to terminate an otherwise feasible authorized computation. Stop after the requested result and proportionate verification are secure; do not add unrequested cross-validation, alternative full-range reruns, extra seeds, extra backends, or optional artifacts.

    Grade evidence as formal, certificate, exact_reproduction, bounded_empirical, or numerical_evidence. A program running successfully, a test passing, or a metric improving verifies only the boundary checked; it is not a correctness proof and not evidence that a mechanism causes an effect, and a scaling fit is never a complexity proof.

    Treat a backend's inner time limit and the outer MCP or shell tool-call deadline as separate limits. Calibrate representative low, middle, and high-cost slices, keep each chunk comfortably inside the shortest call window with a conservative safety margin, checkpoint completed chunks, and prove final non-overlapping coverage. After the required capability or prototype check, route a workload such as a training run that cannot fit tool call windows to a monitorable local process with heartbeats, validated checkpoints, and idempotent resume; keep waiting while progress and resources remain healthy, and inspect whether work is still running before retrying after a timeout.

    When the user explicitly requests the fastest possible completion or minimum wall time, assess safe decomposition and parallel overhead, inspect the actual CPU and accelerator capacity of the selected environment, and attempt a faster valid parallel or vectorized implementation only when it is likely to help; preserve correctness and fall back to the best serial route when parallelism is unavailable, unsafe, or slower. Select the best-fitting callable backend, and create a computation record only for requested reproducible/file delivery or high-assurance work. When an MCP computation tool is primary or explicitly requested, discover it and actually call its execution tool when available; do not substitute a local script for a callable MCP execution tool that the route requires.

    Ordinary calculations, experiments, research and result checking, including work delegated by other Skills, run on the execution environment the user or project designates. Only dedicated testing or evaluation uses the environment selected by the active test contract. Ordinary answer checking and high-assurance computation are not dedicated evaluations. Verify the actual platform, accelerator, and server before calling it; do not silently substitute local, container, remote, accelerator, or CPU execution for one another when the required environment is unavailable. Apply only existing task-permitted fallbacks on the selected platform, preserving MCP-only requirements. Static tests without a computation backend need no backend startup. Follow the Execution Platform Policy in SKILL.md.
